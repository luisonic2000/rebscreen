name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pyinstaller

      - name: Validar antes de compilar
        run: python -m pytest -q

      - name: Compilar Rebscreen
        run: python -m PyInstaller --noconfirm --clean --noconsole --onedir --name Rebscreen --add-data "assets;assets" app.py

      - name: Criar pacote ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\Rebscreen\* -DestinationPath "Rebscreen-${{ github.ref_name }}-windows.zip"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Rebscreen-${{ github.ref_name }}-windows.zip
